<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Resonant Space</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');
      body { background: #0a0a0a; color: #f0f0f0; font-family: 'IBM+Plex+Sans', sans-serif; }
      .display { font-family: 'Space Mono', monospace; }
    </style>
  </head>
  <body>
    <main class="min-h-screen">
      <section class="flex h-screen items-center justify-center p-10">
        <h1 class="display text-center text-7xl font-bold tracking-[-0.02em] md:text-9xl">
          RESONANT<br/>SPACE
        </h1>
      </section>
      <section class="py-32 px-10">
        <div class="mx-auto max-w-4xl border-l border-[#d4af37] pl-10">
          <h2 class="display text-3xl font-bold tracking-[-0.01em]">THE OBSERVATION</h2>
          <p class="mt-8 text-xl leading-relaxed text-[#9a9a9a]">
            Music theory is musical architecture. We move away from lecture-based education into high-end creative tooling for architects of sound.
          </p>
        </div>
      </section>
    </main>
  </body>
</html>
